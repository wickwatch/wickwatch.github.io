<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{t:topic.@.metaTitle}}</title>
  <meta name="description" content="{{t:topic.@.metaDescription}}">
  <link rel="canonical" href="{{url}}">
  <link rel="alternate" hreflang="{{lang}}" href="{{url}}">
  <link rel="alternate" hreflang="{{alternateLang}}" href="{{alternate}}">
  <link rel="alternate" hreflang="x-default" href="{{xDefault}}">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0F1318" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F7F6F2" media="(prefers-color-scheme: light)">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="wickwatch">
  <meta property="og:locale" content="{{locale}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:title" content="{{t:topic.@.metaTitle}}">
  <meta property="og:description" content="{{t:topic.@.metaDescription}}">
  <meta property="og:image" content="{{siteUrl}}/assets/img/social-preview.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json">{{jsonLd}}</script>
  <link rel="icon" href="{{root}}assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="{{root}}assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="{{root}}assets/img/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="{{root}}assets/img/apple-touch-icon.png">
  <link rel="preload" href="{{root}}assets/fonts/space-grotesk-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{root}}assets/css/tokens.css">
  <link rel="stylesheet" href="{{root}}assets/css/site.css">
  <script>
    // Apply a theme chosen earlier before the first paint; without one the system preference decides.
    try { const t = localStorage.getItem("ww-site-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch {}
  </script>
  <script src="{{root}}assets/site.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">{{t:nav.skip}}</a>

{{partial:header}}

  <main id="main" class="topic">
    <article class="wrap">
      <p class="back"><a href="{{home}}">← {{t:topic.back}}</a></p>
      <p class="eyebrow">{{t:topic.@.eyebrow}}</p>
      <h1>{{t:topic.@.title}}</h1>
      <p class="lead">{{t:topic.@.lead}}</p>
{{topicBody}}
      <nav class="more" aria-label="{{t:topic.more}}">
        <h2>{{t:topic.more}}</h2>
        <ul>
          <li><a href="{{home}}ctrader-docker/">{{t:guides.docker.title}}</a></li>
          <li><a href="{{home}}prop-firm-challenges/">{{t:guides.prop.title}}</a></li>
          <li><a href="{{home}}mcp/">{{t:guides.mcp.title}}</a></li>
          <li><a href="{{repo}}/blob/main/docs/USER-GUIDE.md">{{t:footer.guide}}</a></li>
        </ul>
      </nav>
    </article>
  </main>

{{partial:footer}}
</body>
</html>
